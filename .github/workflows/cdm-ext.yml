name: cdm-ext

# Generate the local CDM extension (cdm-ext/rosetta) to Java with CDM 7.7.0's toolchain against cdm-java 7.7.0 and
# run its JUnit tests (cdm-ext/pom.xml, decision wp-adr-java-cdm-stack).

on:
  push:
    branches: [main]
    paths: ["cdm-ext/**", ".github/workflows/cdm-ext.yml"]
  pull_request:
    paths: ["cdm-ext/**", ".github/workflows/cdm-ext.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: cdm-ext/pom.xml
      - run: mvn -B -q -f cdm-ext/pom.xml test
