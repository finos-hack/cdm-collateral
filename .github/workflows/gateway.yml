name: gateway

# Type check of the gateway (gateway/). The gateway runs its TypeScript directly with node, which strips the types and
# checks none of them (task-gateway-type-check).

# No run on the push to main (task-ci-actions-minutes, 2026-11-11): the pull request run checks the same
# commit, since branches are rebased on main before their PR.
on:
  pull_request:
    paths: ["gateway/**", ".github/workflows/gateway.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
      - run: npm run typecheck
