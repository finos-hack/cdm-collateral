name: console

# Typecheck, unit and component tests, production build and Playwright end-to-end tests of the React party
# console (console/). The scenario files drive the end-to-end tests (architecture/testing.md).

on:
  push:
    branches: [main]
    paths: ["console/**", ".github/workflows/console.yml"]
  pull_request:
    paths: ["console/**", ".github/workflows/console.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The runner image ships Google Chrome (CHROME_BIN). Passed as CHROMIUM_PATH, playwright.config.ts uses it as
      # executablePath, so the job needs no apt download (on 2026-11-11 the runner could not resolve
      # azure.archive.ubuntu.com and `playwright install --with-deps` failed). Only an image without Chrome installs
      # Playwright Chromium with its system libraries.
      - name: Browser for the e2e specs
        run: |
          if [ -n "${CHROME_BIN:-}" ] && [ -x "${CHROME_BIN}" ]; then
            echo "CHROMIUM_PATH=${CHROME_BIN}" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: npm run test:e2e
