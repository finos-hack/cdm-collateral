name: e2e-live-stack

# Build, deploy and start the full live stack on a clean machine, then check that every component is healthy
# (task-ci-live-e2e-stack). The collateral flow itself (issue -> agree -> propose -> accept -> pledge/transfer) is
# driven by hand through the console UI, not by this job (wp-adr-live-stack-local-ui-driven). The Playwright live
# specs (console/e2e/live.spec.ts) remain for local runs against a running stack.
#
# The stack is started by scripts/live-e2e.sh up, the same command an engineer runs locally, so CI and the local
# bring-up share one definition. There is no teardown step: the stack is left running for the rest of the job. On a
# GitHub-hosted runner the job's machine is discarded when the job ends and is not reachable from a browser, so the
# job verifies that the stack assembles and starts; the persistent, clickable stack is the local one.
#
# Dependency order: cdm-ext into the local Maven repo -> collateral service jar -> Node dependencies -> Besu QBFT
# network -> deploy contracts (only if not deployed) -> store + two gateways + two services + console -> health checks.

on:
  push:
    branches: [main]
    paths: &paths
      - "besu/**"
      - "contracts/**"
      - "gateway/**"
      - "store/**"
      - "services/**"
      - "cdm-ext/**"
      - "console/**"
      - "scripts/**"
      - "orchestrate.mjs"
      - ".github/workflows/e2e-live-stack.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-live-stack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # node src/server.ts in gateway/ and store/ runs TypeScript directly, so the Node version must strip types
      # natively (Node >= 22.18). setup-node "22" installs the latest 22.x, matching console.yml and the devcontainer.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 1. Build. Install the local CDM extension (local.cdmx:cdmx-java) into the Maven repo so the service jar
      #    resolves it, then build the collateral service jar (JDK 21, shade plugin -> target/collateral-service.jar).
      - name: Install cdm-ext
        run: mvn -B -q -f cdm-ext/pom.xml -DskipTests install

      - name: Build collateral service jar
        run: mvn -B -q -f services/collateral/pom.xml -DskipTests package

      - name: Build oracle service jar
        run: mvn -B -q -f services/oracle/pom.xml -DskipTests package

      - name: Install Node dependencies
        run: |
          npm --prefix contracts ci
          npm --prefix gateway ci
          npm --prefix store ci
          npm --prefix console ci

      # 2-4. Deploy and start. scripts/live-e2e.sh up starts the Besu network (generating genesis and keys on a fresh
      #      runner), waits for blocks, deploys the contracts (no deployment exists on a fresh runner), starts the
      #      store, gateways, services and console through orchestrate.mjs, and exits non-zero unless all seven health
      #      checks pass within 180 s. The stack keeps running after the step.
      - name: Build, deploy and start the live stack
        run: bash scripts/live-e2e.sh up

      - name: Stack status
        if: always()
        run: bash scripts/live-e2e.sh status || true

      - name: Stack log
        if: always()
        run: cat stack.log || true
