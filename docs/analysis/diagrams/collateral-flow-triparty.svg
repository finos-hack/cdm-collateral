<text x="260" y="880" font-size="10.5" letter-spacing="0.6" fill="#5b6470">CDM 7.6.0 COVERAGE</text>
<rect x="410" y="869" width="22" height="14" rx="3" fill="#d8eedd" stroke="#2e7a47" stroke-width="1.5"/>
<text x="440" y="880" font-size="11" fill="#3d444d">executable: functions, events or samples</text>
<rect x="680" y="869" width="22" height="14" rx="3" fill="#f7e7bf" stroke="#a0720f" stroke-width="1.5"/>
<text x="710" y="880" font-size="11" fill="#3d444d">data types only</text>
<rect x="820" y="869" width="22" height="14" rx="3" fill="#ffffff" stroke="#7d8590" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="850" y="880" font-size="11" fill="#3d444d">absent or enum only</text>
<rect x="975" y="869" width="22" height="14" rx="3" fill="#ffffff" stroke="#5b6470" stroke-width="1.5"/>
<text x="1005" y="880" font-size="11" fill="#3d444d">not scored</text>
<text x="260" y="912" font-size="11" fill="#3d444d">Triparty is a way of running repo or securities lending: the parties agree the exposure; the agent selects, values and moves the collateral.</text>
<text x="260" y="928" font-size="11" fill="#3d444d">Not shown: corporate actions on collateral, billing by the agent, central bank triparty (SCoRE).</text>
