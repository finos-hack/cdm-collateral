<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 960" role="img" aria-label="Triparty collateral management: the collateral giver and receiver agree the exposure amount and instruct the triparty agent, which matches the instructions, selects eligible assets from the giver inventory under the collateral profile, settles them on its own books, revalues daily and re-allocates, handles substitutions and reports positions to both parties. Boxes are coloured by how far CDM 7.6.0 models each element." font-family="Helvetica, Arial, sans-serif">
<rect width="1240" height="960" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b424b"/></marker></defs>
<rect x="20" y="20" width="210" height="820" rx="10" fill="#f3f5f8" stroke="#c9ced6"/>
<text x="125.0" y="46" text-anchor="middle" font-size="15" font-weight="700" fill="#1d2228">Collateral giver</text>
<text x="125.0" y="64" text-anchor="middle" font-size="11" fill="#5b6470">e.g. repo seller</text>
