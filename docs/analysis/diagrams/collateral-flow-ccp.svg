<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 940" role="img" aria-label="Cleared margin at a central counterparty: cleared trades are held as positions in house and client accounts; the CCP computes initial margin with its own model and variation margin from settlement prices and issues a margin call that is not negotiated; the clearing member pays into segregated margin accounts and calls margin from its clients; the CCP pays interest on cash margin and runs default management and porting. Boxes are coloured by how far CDM 7.6.0 models each element." font-family="Helvetica, Arial, sans-serif">
