<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1270" role="img" aria-label="Securities lending under the ISLA GMSLA: the lender delivers securities and the borrower posts collateral worth the loan value times the margin. The loan is marked to market daily, the borrower pays a fee or receives a rebate on cash collateral, manufactured payments pass income back to the lender, and on return or recall the securities and collateral go back. Boxes are coloured by how far CDM 7.6.0 models each element." font-family="Helvetica, Arial, sans-serif">
