<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 920" role="img" aria-label="Conceptual model of bilateral collateral management under an ISDA credit support document: agreements set the terms, trades are netted into an exposure, the exposure becomes a delivery or return amount, the secured party issues a margin call, the pledgor responds, agreed amounts are posted into a collateral account, and the collateral balance feeds the next calculation. Boxes are coloured by how far CDM 7.6.0 models each element." font-family="Helvetica, Arial, sans-serif">
